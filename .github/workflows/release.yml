name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.3.9'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.vars.outputs.tag }}

      - name: Verify release tag
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test
        run: |
          go test ./...
          npm --prefix web run typecheck

      - name: Build release archives
        run: make build-all VERSION='${{ steps.vars.outputs.tag }}'

      - name: Collect release notes
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          awk -v tag="$tag" '
            $0 ~ ("^# MindFS " tag "$") { capture=1; next }
            capture && /^# MindFS / { exit }
            capture { print }
          ' release-notes.md > dist/release-notes-${tag}.md
          test -s dist/release-notes-${tag}.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: dist/release-notes-${{ steps.vars.outputs.tag }}.md
          files: |
            dist/mindfs_${{ steps.vars.outputs.tag }}_darwin_amd64.tar.gz
            dist/mindfs_${{ steps.vars.outputs.tag }}_darwin_arm64.tar.gz
            dist/mindfs_${{ steps.vars.outputs.tag }}_linux_amd64.tar.gz
            dist/mindfs_${{ steps.vars.outputs.tag }}_linux_arm64.tar.gz
            dist/mindfs_${{ steps.vars.outputs.tag }}_linux_arm.tar.gz
            dist/mindfs_${{ steps.vars.outputs.tag }}_windows_amd64.zip
            dist/mindfs_${{ steps.vars.outputs.tag }}_windows_arm64.zip
